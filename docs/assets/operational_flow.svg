<text x="800" y="951" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#89e1b8">Attribution Strength is not a calibrated probability. Anomaly/root-cause benchmark metrics belong to controlled semi-synthetic tests.</text></svg>